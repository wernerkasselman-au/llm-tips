# ServiceNow-Scale Proposal Triage DAG
# =====================================
# Coordinates intake, structural validation, High-Signal writing quality
# checks, ownership attestation, and prioritised shortlisting of proposals
# so that senior architects spend judgement only on the highest-signal work.
#
# STYLE GUIDE:
#   High-Signal Writing Guide (formerly Anti-AI-Tell Style Guide)
#   style_guide.md + tools/style_policy.toml
#
# KEY ADDITIONS vs original writing-audit DAG:
#   - Mandatory short synopsis (BLUF) for any document ≥ 600 words
#   - Structural gates drawn from ADR + Design Doc patterns
#     (Goals/Non-goals, Alternatives considered, Consequences/Impact)
#   - Explicit ownership attestation (Clay principle 1)
#   - Reader-time / length justification
#   - Funnel to prioritised shortlist + evidence pack for architects
#
# HARD INVARIANTS (unchanged):
#   - `blocks` is exact inverse of direct `depends_on`
#   - each `ART:` id has exactly one producer
#   - each `consumes` entry matches an existing `produces` entry exactly
#   - `layer` ordering follows dependency ordering
#   - `[computed]` values are derived from `units`, never guessed
#
# STATUS VALUES: "pending" | "in_progress" | "done" | "blocked" | "deferred"
# TIER VALUES:   1 = current release

