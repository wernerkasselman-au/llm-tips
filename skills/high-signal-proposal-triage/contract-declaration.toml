# High-Signal Proposal Triage Contract
#
# Requirement IDs, severities, and promotion rules for proposal intake.
#
# ENFORCEMENT STATUS: executable, in part. check_proposal.py runs the structural
# gates (REQ:synopsis, REQ:ownership-present, REQ:structure, REQ:evidence-pack) and
# tools/lint_writing_style.py runs the text scans (part of REQ:high-signal). Both run
# in CI via .github/workflows/proposal-checks.yml. Each requirement below states what
# its checker does and does not cover; read those notes before citing this file as
# proof that anything was enforced.
#
# The checker reads its thresholds from the DAG at run time and fails closed (exit 2)
# if the DAG does not state them unambiguously. It never falls back to a default.
#
# THRESHOLDS ARE NOT DECLARED HERE. They live in the companion DAG. Restating a
# number in two files guarantees the two will eventually disagree.

[meta]
title = "High-Signal Proposal Triage Contract"
template_kind = "contract-declaration"
schema_version = "0.1.0"
created = "2026-08-13"
enforcement = "partial"
checker = "check_proposal.py"
checker_tests = "tests/test_check_proposal.py"
ci_workflow = "../../.github/workflows/proposal-checks.yml"

[source_of_truth]
# Read every threshold from the DAG at load time. Paths are relative to this file.
companion_dag = "../../tools/proposal_triage_dag.toml"
companion_guide = "../../high_signal_writing_guide.md"
executable_policy = "../../tools/style_policy.toml"
executable_checker = "../../tools/lint_writing_style.py"

# Where each number actually lives, by DAG unit rather than by line number, so
# this mapping survives edits to the DAG.
synopsis_trigger = "units.U01 (document classification by word count)"
synopsis_cap = "units.U02 (synopsis-and-ownership-gate)"
structural_minimums = "units.U03 (structural-section-check)"
rewrite_threshold = "units.U07 (triage-scoring-and-classification)"

[policy]
# Which gates block automatic shortlisting. Numbers deliberately absent.
hard_gates = ["REQ:synopsis", "REQ:ownership-present", "REQ:structure", "REQ:high-signal", "REQ:evidence-pack"]
soft_signals = ["REQ:reader-time", "REQ:impact-summary"]
report_skipped_gates = true

[[requirements]]
id = "REQ:synopsis"
statement = "A document above the DAG's synopsis trigger MUST supply a synopsis within the DAG's cap, containing problem, proposed action, primary trade-off or system impact, and explicit ask."
severity = "hard"
dag_unit = "U02"
enforcement = "executable"
checkable = true
checker_note = "Run from the repo root: python3 skills/high-signal-proposal-triage/check_proposal.py --packet <dir>. Checks the document against the DAG trigger, the synopsis against the DAG cap, and the four labelled elements (Problem, Proposed action, Trade-off or Impact, Ask). Does not judge whether the four elements are any good."

[[requirements]]
id = "REQ:ownership-present"
statement = "An ownership attestation MUST be present and signed by a named author, and MUST be carried in the evidence pack."
severity = "hard"
dag_unit = "U02"
enforcement = "executable"
checkable = true
checker_note = "Run from the repo root: python3 skills/high-signal-proposal-triage/check_proposal.py --packet <dir>. Checks that ownership.toml exists, parses, has a non-empty [attestation] author and statement, and an ISO signed date. Presence and signature only. Nothing verifies that the thinking is the author's own, and no gate here claims to."

[[requirements]]
id = "REQ:structure"
statement = "Design-doc, RFC, and SAD types MUST contain Goals, Non-goals, Alternatives considered with at least one rejected alternative and its reason, and Consequences or Impact. ADR-lite MAY substitute Context, Decision, Consequences."
severity = "hard"
dag_unit = "U03"
enforcement = "partial"
checkable = true
checker_note = "Run from the repo root: python3 skills/high-signal-proposal-triage/check_proposal.py --packet <dir>. Checks heading presence for the document type, and that the Alternatives section names a rejected alternative. Does NOT check that the rejection reason is sound, or that a section has meaningful content beyond existing."

[[requirements]]
id = "REQ:high-signal"
statement = "Document and synopsis MUST be scanned against the High-Signal Writing Guide. Weighted hits at or above the DAG's rewrite threshold trigger rewrite from the notes rather than sentence edits."
severity = "hard"
dag_units = ["U04", "U05", "U07"]
enforcement = "partial"
checkable = true
checker_note = """Executable part, run from the repo root: python3 tools/lint_writing_style.py \
--policy tools/style_policy.toml <file>. Exit 0 clean, 1 violations, 2 invocation error. \
That covers per-file vocabulary, structure, voice, and formatting scans (U04, U05) only. \
NOT executable: the synopsis 1.5x weighting (proposal_triage_dag.toml:214), the weighted \
scoring and rewrite routing of U07, and any document-plus-synopsis pairing. The linter \
scores nothing and routes nothing; it reports violations per file. \
Also note AIS:TN02 (opinionated_claims_per_document_minimum) has no implementation. The \
linter reports it under NOT CHECKED and excludes it from the applied count, so a clean run \
no longer implies it was tested. Run with --strict-metrics to make any such gap exit 2."""

[[requirements]]
id = "REQ:evidence-pack"
statement = "A shortlisted item MUST ship a self-contained evidence pack whose first element is the synopsis."
severity = "hard"
dag_unit = "U10"
enforcement = "executable"
checkable = true
checker_note = "Run from the repo root: python3 skills/high-signal-proposal-triage/check_proposal.py --packet <dir>. Checks that the pack parses, that pack.items is non-empty, that every listed item exists on disk, and that the first item is the synopsis when a synopsis exists. A document below the trigger has no synopsis to lead with and is exempt from the ordering rule."

[[requirements]]
id = "REQ:reader-time"
statement = "A reader-time and length-justification signal SHOULD accompany every triaged document."
severity = "soft"
dag_unit = "U06"
enforcement = "manual"
checkable = true

[[requirements]]
id = "REQ:impact-summary"
statement = "Impacted systems, services, data domains, and teams SHOULD be stated explicitly for shortlisted and borderline documents."
severity = "soft"
dag_unit = "U09"
enforcement = "manual"
checkable = false
checker_note = "Free text today. Becomes checkable only against a real architecture inventory, which does not exist here."

[promotion]
# What must hold before a document reaches a senior architect.
blocks_on = ["hard"]
auto_promote = false
requires_gate_report = true
gate_report_note = "The run MUST state which gates executed and which were skipped. A run that skipped every unexecutable gate must not be reported as a clean pass."

[roadmap]
# Ordered. The example comes first because it is the checker's first fixture and
# the fastest way to find out whether these rules survive a real document.
done = [
  "examples/minimal-proposal-packet/ (worked example, doubles as the test fixture)",
  "check_proposal.py (synopsis trigger and cap, four-element presence, heading presence, rejected alternative, attestation, evidence-pack shape)",
  "tests/test_check_proposal.py (29 tests; every negative case adds a violation rather than removing a rule)",
  "CI wiring in .github/workflows/proposal-checks.yml",
]
next_artefacts = [
  "reader-time signal (REQ:reader-time) has no checker",
  "architecture-inventory adapter to ground REQ:impact-summary",
  "a synopsis quality check; presence of the four elements is not quality",
]
